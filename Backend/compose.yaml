services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - 27017:27017
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
  server:
    build:
      context: .
    env_file:
      - .env
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/little_steps
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - 3000:3000
    volumes:
      - provider-documents:/usr/src/app/storage/provider-applications

volumes:
  provider-documents:
  mongodb-data:
